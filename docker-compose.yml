# Local infrastructure for development and tests.
#   docker compose up -d redis     # start
#   docker compose down            # stop (add -v to delete data)
services:
  redis:
    image: redis:7.4-alpine
    # Bound to localhost only; never expose Redis publicly.
    ports:
      - "127.0.0.1:6379:6379"
    # Persist jobs across restarts. BullMQ requires maxmemory-policy noeviction.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
